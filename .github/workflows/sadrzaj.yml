# Privremeno: skupljanje sadržaja (cene, pesme, slike) sa mreže. Briše se pre spajanja u main.
name: sadrzaj
on:
  push:
    branches: [sadrzaj-cene-pesme]
    paths: [ci/zadatak.json]
permissions:
  contents: write
jobs:
  skupi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund sharp@0.34
      - run: node ci/sadrzaj.mjs
      - name: Vrati rezultat u granu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ci/izlaz public/artikli data/products.json
          git diff --cached --quiet || git commit -m "ci: rezultat skupljanja sadržaja"
          git push
