<!--
  Supabase → Authentication → Emails → Templates → „Confirm signup”
  Subject: Potvrdi mejl i ulaziš na rang listu
-->
<!doctype html>
<html lang="sr-Latn">
  <body style="margin:0;padding:0;background:#1b1311;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1b1311;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
            <tr>
              <td style="padding:0 8px 24px;font-family:Verdana,Arial,sans-serif;font-size:26px;font-weight:bold;color:#ffefd6;">
                Čik <span style="color:#ff4b33;">Pogodi!</span>
              </td>
            </tr>
            <tr>
              <td style="background:#2b1d19;border-radius:16px;padding:28px 24px;font-family:Verdana,Arial,sans-serif;color:#ffefd6;">
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#ffefd6;">Još samo jedan klik</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#ffefd6;">
                  Potvrdi da je ovo tvoj mejl i nalog je spreman. Rezultat koji čeka odmah ulazi na rang listu.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background:#ff4b33;border-radius:14px;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                         style="display:inline-block;padding:16px 28px;font-family:Verdana,Arial,sans-serif;font-size:18px;font-weight:bold;color:#1b1311;text-decoration:none;">
                        Potvrdi mejl
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.55;color:#cdb9ac;">
                  Nisi ti pravio nalog? Slobodno ignoriši ovaj mejl, ništa se neće desiti.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0;font-family:Verdana,Arial,sans-serif;font-size:12px;line-height:1.5;color:#cdb9ac;">
                Čik Pogodi! · dnevni kviz · cikpogodi.rs
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
